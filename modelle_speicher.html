<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Produktbilder Übersicht – mit Speicherfunktion</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 20px auto;
      line-height: 1.5;
    }
    h1 {
      margin-bottom: 30px;
    }
    .modell {
      border: 2px solid #ddd;
      padding: 20px;
      margin-bottom: 30px;
    }
    .modell h2 {
      margin-top: 0;
      background: #f5f5f5;
      padding: 10px;
    }
    .block {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid #eee;
      padding-bottom: 20px;
    }
    .block img {
      max-width: 250px;
      border: 1px solid #ccc;
    }
    .textfeld {
      flex: 1;
    }
    textarea {
      width: 100%;
      height: 120px;
      font-size: 14px;
      padding: 10px;
      border: 1px solid #ccc;
      resize: vertical;
    }
  </style>

  <script>
    // Speichern beim Tippen
    function saveText(id) {
      const value = document.getElementById(id).value;
      localStorage.setItem(id, value);
    }

    // Beim Laden wiederherstellen
    function loadAll() {
      const fields = document.querySelectorAll("textarea");
      fields.forEach(f => {
        const saved = localStorage.getItem(f.id);
        if (saved !== null) f.value = saved;
      });
    }
  </script>
</head>

<body onload="loadAll()">
